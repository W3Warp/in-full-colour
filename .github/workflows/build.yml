name: Build ColorControl with webOS 26 fix (PR 608)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get ColorControl source (pull request 608, pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Maassoft/ColorControl
          ref: f0c64a66bafa2fd8e2c483eb7e1f0c7c5521815d

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build (Visual Studio MSBuild)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          Write-Host "Using MSBuild: $msbuild"
          & $msbuild ColorControl/ColorControl.csproj -restore -m -nologo -v:minimal "-p:Configuration=Release" "-p:Platform=x64" "-p:GenerateDocumentationFile=false" "-flp:logfile=build.log;verbosity=normal"
          "BUILD_EXIT=$LASTEXITCODE" | Out-File build-status.txt
          exit 0

      - name: Package whatever was built
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build.log, build-status.txt -Destination package -ErrorAction SilentlyContinue
          Select-String -Path build.log -Pattern ' error ' | Select-Object -First 40 | ForEach-Object { $_.Line } | Out-File package/ERRORS.txt
          $exe = Get-ChildItem -Path ColorControl -Recurse -Filter ColorControl.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if ($exe) {
            Write-Host "Found $($exe.FullName)"
            New-Item -ItemType Directory -Path package/app -Force | Out-Null
            Copy-Item -Path "$($exe.DirectoryName)/*" -Destination package/app -Recurse
          } else {
            Write-Host "No ColorControl.exe found - see ERRORS.txt"
          }

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ColorControl-webOS26-fix
          path: package

      - name: Publish release (only if the build produced a program)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path package/app/ColorControl.exe)) {
            Write-Host "No ColorControl.exe built - skipping release."
            exit 0
          }
          Compress-Archive -Path package/app/* -DestinationPath ColorControl-webOS26-fix.zip -Force
          $tag = "webos26-pr608-f0c64a6"
          $repo = $env:GITHUB_REPOSITORY
          @"
          UNOFFICIAL build of ColorControl with the webOS 26 remote-control fix.

          Built from pull request #608 (https://github.com/Maassoft/ColorControl/pull/608), commit f0c64a66bafa2fd8e2c483eb7e1f0c7c5521815d.
          Source: https://github.com/Maassoft/ColorControl/commit/f0c64a66bafa2fd8e2c483eb7e1f0c7c5521815d (GPL-3.0, see the ColorControl repository).
          Built by the public workflow in this repository, so you can verify it or rebuild it yourself.

          Needs .NET 10 Desktop Runtime and ASP.NET Core Runtime 10. Tick "Enable webOS 26 compatibility" and re-pair the TV.
          Credit: jamking (pull request #608) and the LGTV Companion project. No support from Maassoft, please.
          "@ | Out-File notes.md -Encoding utf8
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $repo --yes --cleanup-tag }
          gh release create $tag ColorControl-webOS26-fix.zip --repo $repo --title "ColorControl webOS 26 fix (unofficial, PR 608)" --notes-file notes.md
